# Git dependencies (the client and the transport forks) are fetched over
# https through the git CLI, which uses the machine's own git configuration.
# The client was pinned over ssh:// until it became public; Cargo's built-in
# fetch could not authenticate with this machine's ssh-agent then. The
# command-line override is CARGO_NET_GIT_FETCH_WITH_CLI=true; this file makes
# it the default for this repository.
[net]
git-fetch-with-cli = true
