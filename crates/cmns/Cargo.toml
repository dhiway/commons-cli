[package]
name = "cmns"
description = "The Commons command line: administer a node, its sidecar and its capabilities"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cmns"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
commons-node-client.workspace = true
commons-release-verify.workspace = true
flate2.workspace = true
hex.workspace = true
icu_properties.workspace = true
iroh.workspace = true
iroh-tickets.workspace = true
reqwest.workspace = true
rustls.workspace = true
semver.workspace = true
serde_json.workspace = true
tar.workspace = true
time.workspace = true
tokio.workspace = true

[dev-dependencies]
# The fake node in the call-timeout test completes a real session open, so it
# signs a session certificate, and it builds its endpoint from the same
# Commons profile the caller uses; both crates come from the client repository
# at the same pin as the client itself.
auth-wire = { git = "https://github.com/dhiway/commons-node-client.git", rev = "2460a97632f01bbb7c08a8c57e1935238f037699" }
postcard = { version = "1.1.3", features = ["use-std"] }
# The update tests sign their own manifests with a throwaway key, as
# `ssh-keygen -Y sign` would; the versions are the verifier's own.
base64 = "0.23.1"
ed25519-dalek = { version = "3.0.0", default-features = false }
sha2 = "0.11.1"
