[workspace]
resolver = "2"
members = ["crates/cmns"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99.0"
license = "Apache-2.0"
repository = "https://github.com/dhiway/commons-cli"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
commons-node-client = { git = "ssh://git@github.com/dhiway/commons-node-client.git", rev = "b7e5d82dd79afff937d10495e978a90213def4f3" }
hex = "0.4.3"
iroh = { version = "1.5", features = ["default"] }
iroh-tickets = "1"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

# The node's transport forks, as in commons-node-client's transport-pins.toml.
# scripts/check-transport-pins.py fails when this drifts from that file.
[patch.crates-io]
iroh-blobs = { git = "https://github.com/dhiway/iroh-blobs", rev = "39ec1d2a226c2e6682756e498276b989cf6269d1" }
iroh = { git = "https://github.com/dhiway/iroh", rev = "53eeba9b1da316c8e6f7d1366ebcbf338f18c9e0" }
iroh-base = { git = "https://github.com/dhiway/iroh", rev = "53eeba9b1da316c8e6f7d1366ebcbf338f18c9e0" }
iroh-dns = { git = "https://github.com/dhiway/iroh", rev = "53eeba9b1da316c8e6f7d1366ebcbf338f18c9e0" }
iroh-relay = { git = "https://github.com/dhiway/iroh", rev = "53eeba9b1da316c8e6f7d1366ebcbf338f18c9e0" }
noq = { git = "https://github.com/dhiway/noq", rev = "a651c1353017ab6643ea65880ce390fcd2df547d" }
noq-proto = { git = "https://github.com/dhiway/noq", rev = "a651c1353017ab6643ea65880ce390fcd2df547d" }
noq-udp = { git = "https://github.com/dhiway/noq", rev = "a651c1353017ab6643ea65880ce390fcd2df547d" }

# Release binaries are optimised (owner ruling 2026-11-20): no debug build is
# ever published. Step G's per-platform release uses this profile.
[profile.release]
lto = true
codegen-units = 1
strip = true
